<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BitPromo Phone Preview</title>
<meta name="description" content="Shows the BitPromo prototype inside a phone frame at real phone sizes.">
<style>
:root{--bg:#F4F6FA;--surface:#FFFFFF;--ink:#0E1526;--muted:#5D6679;--line:#E3E7EF;--accent:#2453FF;--accent-soft:#ECF1FF;--frame:#11151F}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:1100px;padding:18px 20px 6px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;display:flex;gap:8px;align-items:center}
h1 b{color:var(--accent)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.ctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pages{max-width:1100px;padding:4px 20px 0}
.stage{flex:1;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:14px 0 28px}
.scaler{transform-origin:top center}
.phone{position:relative;background:var(--frame);border-radius:58px;padding:12px;box-shadow:0 0 0 2px #2A303D,0 30px 80px rgba(14,21,38,.25)}
.screen{position:relative;background:#fff;border-radius:46px;overflow:hidden;display:flex;flex-direction:column}
.status{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font:600 15px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#000;background:#fff;position:relative;z-index:2}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.icons{display:flex;gap:6px;align-items:center}
iframe{border:0;display:block;width:100%;flex:1;background:#fff}
.home{height:22px;flex:none;background:#fff;display:grid;place-items:center}
.home i{width:134px;height:5px;border-radius:3px;background:#0E1526;opacity:.9}
.android .screen{border-radius:28px}.android.phone{border-radius:36px;padding:10px}
.android .island{width:12px;height:12px;border-radius:50%;top:12px}
.android .status{height:34px;padding:0 20px;font-size:13px}
.android .home{height:18px}.android .home i{width:100px;height:4px}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:0 20px 18px}
</style>
</head>
<body>
<header>
  <h1><span class="mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></span><span>Bit<b>Promo</b></span><span style="font-weight:600;color:var(--muted);margin-left:6px">phone preview</span></h1>
  <div class="ctl" id="devices"></div>
</header>
<div class="ctl pages" id="pages"></div>
<div class="stage"><div class="scaler" id="scaler"><div class="phone" id="phone"><div class="screen" id="screen">
  <div class="status"><span id="clock">9:41</span><span class="island"></span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3A10.5 10.5 0 0 0 8 .7 10.5 10.5 0 0 0 .8 3.6L2 4.9a8.7 8.7 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4.3a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zM8 9.6 9.9 7.7a2.8 2.8 0 0 0-3.8 0z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2.5" y="2.5" width="18" height="8" rx="2"/><path d="M24.5 4.5v4a2 2 0 0 0 0-4z" opacity=".5"/></svg>
  </span></div>
  <iframe id="app" title="BitPromo app" src="index.html#home"></iframe>
  <div class="home"><i></i></div>
</div></div></div></div>
<p class="note">The frame shows the real prototype (index.html) at the selected phone's CSS width. Tap around inside it like a phone. Open index.html on an actual phone for the full experience.</p>
<script>
const DEV=[['iPhone 15 / 14','iphone',390,844],['iPhone 15 Plus','iphone',430,932],['iPhone SE','iphone',375,667],['Galaxy S23','android',360,780],['Pixel 8','android',412,915]];
const PAGES=[['Home','home'],['Explore','explore'],['Creator profile','creator~c1'],['Order','order~c1~1'],['Track order','track'],['Business dashboard','dash~biz~home'],['Creator dashboard','dash~creator~home'],['Messages','dash~biz~messages'],['Sign in','signin']];
let cur=0;const $=s=>document.querySelector(s);
function apply(){const[,kind,w,h]=DEV[cur];const ph=$('#phone');ph.className='phone '+kind;
 const sc=$('#screen');sc.style.width=w+'px';sc.style.height=h+'px';
 document.querySelectorAll('#devices button').forEach((b,i)=>b.classList.toggle('on',i===cur));fit();}
function fit(){const ph=$('#phone'),s=$('#scaler');s.style.transform='none';const avail=window.innerHeight-$('.stage').getBoundingClientRect().top-36;const H=ph.offsetHeight;const k=Math.min(1,avail/H);s.style.transform=`scale(${k})`;s.style.height=(H*k)+'px';}
$('#devices').innerHTML=DEV.map(([n,,w])=>`<button>${n} · ${w}px</button>`).join('');
$('#devices').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=[...b.parentNode.children].indexOf(b);apply();};
$('#pages').innerHTML=PAGES.map(([n])=>`<button>${n}</button>`).join('');
$('#pages').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=PAGES[[...b.parentNode.children].indexOf(b)][1];const f=$('#app');try{f.contentWindow.go(r);}catch(_){f.src='index.html#'+r;}};
const tick=()=>{const d=new Date();$('#clock').textContent=d.getHours()%12||12;$('#clock').textContent+=':'+String(d.getMinutes()).padStart(2,'0');};tick();setInterval(tick,30000);
addEventListener('resize',fit);apply();
</script>
</body>
</html>
