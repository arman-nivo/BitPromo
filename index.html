<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BitPromo</title>
<meta name="description" content="BitPromo: promotional video marketplace prototype">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Plus+Jakarta+Sans:wght@500..800&family=Hind+Siliguri:wght@500;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: marketplace shell. Light neutral surfaces, one electric-blue accent, gold for ratings. */
:root{
  --bg:#FFFFFF;--bg-2:#F4F6FA;--surface:#FFFFFF;--ink:#0E1526;--ink-2:#2A3348;--muted:#5D6679;--line:#E3E7EF;
  --accent:#2453FF;--accent-2:#1A3FD6;--accent-soft:#ECF1FF;--on-accent:#FFFFFF;
  --gold:#E89B0C;--good:#108A47;--good-soft:#E5F5EC;--warn:#A86400;--warn-soft:#FFF3DD;--bad:#C93636;--bad-soft:#FCEBEB;
  --night:#F4F6FA;--night-2:#FFFFFF;--night-line:#E3E7EF;--on-night:#0E1526;--on-night-2:#5D6679;
  --shadow:0 1px 2px rgba(14,21,38,.05),0 10px 30px rgba(14,21,38,.07);
  --shadow-lg:0 20px 60px rgba(10,16,32,.22);
  --f-display:"Plus Jakarta Sans","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter","Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;--r-sm:10px;--wrap:1240px;
}
/* Light mode is the default. Dark mode only applies if data-theme="dark" is set on <html>. */
:root[data-theme="dark"]{
  --bg:#0A0E18;--bg-2:#0F1522;--surface:#141B2A;--ink:#E8ECF5;--ink-2:#C9D0DF;--muted:#96A1B8;--line:#242D41;
  --accent:#5E80FF;--accent-2:#7C97FF;--accent-soft:#18224A;--on-accent:#FFFFFF;
  --gold:#F4B23A;--good:#3CC57A;--good-soft:#11291D;--warn:#F0A936;--warn-soft:#2B2210;--bad:#F07070;--bad-soft:#2E1515;
  --night:#060A13;--night-2:#0F1524;--night-line:#1F2739;--on-night:#EEF1F8;--on-night-2:#A6B0C6;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(34px,5vw,60px);font-weight:800;letter-spacing:-.035em}
h2{font-size:clamp(26px,3vw,38px);font-weight:750;letter-spacing:-.03em}
h3{font-size:18.5px;font-weight:700;letter-spacing:-.015em}
h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
p{text-wrap:pretty}
p{margin:0}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.i-fill{fill:currentColor;stroke:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.hide{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:650;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s,color .15s;white-space:nowrap;background:none;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--accent);color:var(--on-accent)}
.btn-pri:hover{background:var(--accent-2)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-dark:hover{opacity:.9}
.btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-light{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-light:hover{background:var(--accent-soft)}
.btn-outline-light{border-color:var(--line);color:var(--ink)}
.btn-outline-light:hover{background:var(--surface);border-color:var(--accent)}
.btn-good{background:var(--good);color:#fff}
.btn-sm{padding:7px 14px;font-size:13.5px}
.btn-lg{padding:14px 26px;font-size:16px}
.btn-block{width:100%}
.btn-link{background:none;border:0;color:var(--accent);font-weight:650;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--ink)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);transition:box-shadow .25s}
.top.scrolled{box-shadow:0 6px 24px rgba(14,21,38,.07)}
.top-in{display:flex;align-items:center;gap:14px;height:68px}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.03em;cursor:pointer;background:none;border:0;padding:0}
.logo b{color:var(--accent);font-weight:800}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.logo-mark svg{width:14px;height:14px;margin-left:2px}
.nav{display:flex;gap:2px;align-items:center}
.nav button{white-space:nowrap;background:none;border:0;padding:8px 9px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer;font-size:14.5px}
.nav button:hover,.nav button.on{color:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;height:40px;background:var(--bg-2);min-width:0}
.top-search input{border:0;background:none;outline:0;width:170px;min-width:0}
.menu-btn{display:none}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(6,10,19,.5);display:flex;justify-content:flex-end}
.drawer-in{width:min(320px,86vw);height:100%;background:var(--surface);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.drawer-in button.dl{background:none;border:0;text-align:left;padding:12px 10px;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);display:flex;gap:12px;align-items:center}
.drawer-in button.dl:hover{background:var(--bg-2)}
.userchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.userchip .av{width:30px;height:30px}

/* avatars & media */
.av{display:inline-block;border-radius:50%;overflow:hidden;flex:none;position:relative;width:44px;height:44px}
.av svg{width:100%;height:100%;display:block}
.av-sq{border-radius:var(--r)}
.vbadge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;flex:none}
.vbadge svg{width:11px;height:11px;stroke-width:3.2}
.vt{position:relative;overflow:hidden;border-radius:var(--r);cursor:pointer;isolation:isolate;background:linear-gradient(160deg,var(--a),var(--b));aspect-ratio:4/5;max-width:100%;display:block;width:100%;border:0;padding:0;text-align:left;color:#fff;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.vt.v{aspect-ratio:9/16}
.vt.h{aspect-ratio:16/10}
.vt-scene{position:absolute;inset:0}
.vt-scene::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.45),transparent 45%);z-index:0}
.vt-scene svg{position:absolute;left:50%;bottom:-2%;width:96%;transform:translateX(-50%);transition:transform 5s ease-out;z-index:1}
.vt.h .vt-scene svg{width:62%}
.vt:hover .vt-scene svg{transform:translateX(-50%) scale(1.08)}
/* frosted labels: brand the sample was made for (left) and length (right) */
.vt-prop,.vt-dur{position:absolute;z-index:4;top:10px;background:rgba(10,14,24,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1;padding:6px 10px;white-space:nowrap}
.vt-prop{left:10px;max-width:calc(100% - 84px);overflow:hidden;text-overflow:ellipsis}
.vt-dur{right:10px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;padding-left:8px}
.vt-dur svg{width:9px;height:9px;fill:currentColor;stroke:none}
.vt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,19,.22),transparent 20%,transparent 64%,rgba(6,10,19,.5));z-index:2;pointer-events:none}
.vt.has-cap::after{background:linear-gradient(180deg,rgba(6,10,19,.22),transparent 20%,transparent 46%,rgba(6,10,19,.82))}
.vt-play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.96);color:#0A1020;display:grid;place-items:center;opacity:0;transition:transform .25s,opacity .25s;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.vt-play svg{width:20px;height:20px;margin-left:3px;fill:currentColor}
.vt:hover .vt-play,.vt:focus-visible .vt-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.vt-cap{position:absolute;z-index:3;left:14px;right:14px;bottom:14px;font-weight:650;font-size:14px;line-height:1.3;letter-spacing:-.005em}
.vt-cap small{display:block;font-weight:500;opacity:.82;font-size:12px;margin-top:3px}
.vt-bar{position:absolute;z-index:4;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.vt-bar i{display:block;height:100%;width:0;background:#fff}
.vt:hover .vt-bar i,.vt.playing .vt-bar i{animation:prog 7s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.ccard:hover .vt{transform:translateY(-4px);box-shadow:0 18px 40px rgba(14,21,38,.16)}
.fav{position:absolute;z-index:5;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;border:0;cursor:pointer;color:#0A1020;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .15s}
.fav:hover{transform:scale(1.08)}
.fav.on{color:#E0466E}
.fav.on svg{fill:currentColor}

/* sections */
.sec{padding-block:clamp(48px,7vw,88px)}
.sec-alt{background:var(--bg-2)}
.sec-night{background:var(--night);color:var(--on-night)}
.sec-night .muted{color:var(--on-night-2)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-head p{max-width:560px;margin-top:8px}

/* hero */
.hero{background:var(--night);color:var(--on-night);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(800px 400px at 85% 10%,rgba(36,83,255,.1),transparent 60%),radial-gradient(500px 300px at 10% 100%,rgba(36,83,255,.06),transparent 60%)}
.hero-in{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:clamp(44px,6vw,80px)}
.hero h1 span{color:var(--accent)}
.hero h1 .w{color:inherit;display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .14em;margin:0 -.03em -.14em}
.hero h1 .wi{color:inherit;display:inline-block}
.hero-sub{font-size:18px;color:var(--on-night-2);margin-top:18px;max-width:540px}
.hero-search{margin-top:28px;display:flex;background:#fff;border-radius:999px;padding:6px;max-width:580px;box-shadow:0 10px 40px rgba(14,21,38,.12)}
.hero-search input{flex:1;min-width:0;border:0;outline:0;padding:0 18px;font-size:16px;color:#0E1526;background:none}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.chip-n{border:1px solid var(--line);color:var(--ink-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip-n:hover{background:var(--accent-soft);border-color:var(--accent)}
.hero-ctas{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.collage .col{display:flex;flex-direction:column;gap:14px}
.collage .col:nth-child(2){transform:translateY(34px)}
.collage .col:nth-child(3){transform:translateY(-14px)}
.float-card{position:absolute;z-index:6;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#0E1526;border-radius:14px;padding:10px 16px 10px 10px;box-shadow:0 18px 50px rgba(10,16,32,.18),0 0 0 1px rgba(14,21,38,.05);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:650;line-height:1.35}
.float-card small{display:block;color:#5D6679;font-weight:500;font-size:12px}
.float-card .fi{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.trustrow{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:30px;color:var(--on-night-2);font-size:13.5px;font-weight:600}
.trustrow span{display:inline-flex;gap:7px;align-items:center}
.trustrow .i{color:var(--accent)}
.statband{border-top:1px solid var(--night-line);position:relative}
.statband .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-block:22px}
.statband b{font-family:var(--f-display);font-size:28px;font-weight:800;letter-spacing:-.03em;display:block;color:var(--ink);font-variant-numeric:tabular-nums}
.statband span{color:var(--on-night-2);font-size:13px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ccard{display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.ccard-body{display:flex;flex-direction:column;gap:6px;padding:0 2px}
.ccard .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.ccard .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ccard .desc{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.ccard .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:14px 0 0;margin-top:4px;background:transparent;color:var(--ink);font-size:inherit}
.ccard .foot .price{display:flex;flex-direction:column;gap:2px}
.ccard .foot .price small{font-size:11px;line-height:1.2;letter-spacing:.05em}
.ccard .foot .price-value{color:var(--accent-2);font-size:18px;line-height:1.2;font-weight:800}
.ccard .foot .btn{min-height:40px;padding-inline:14px}
.ccard .foot .btn .i{transition:transform .15s}
.ccard .foot .btn:hover .i{transform:translateX(3px)}
.ccard:hover .name{color:var(--accent)}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.price small{font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);font-size:14px}
.rating .i{color:var(--gold);fill:var(--gold);stroke:var(--gold)}
.rating span{color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag-acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--bg-2);color:var(--muted)}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 14px;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}

/* trending */
.tcard{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(14,21,38,.16)}
.tcard .vt{border-radius:20px}
.tcard .vt::after{background:linear-gradient(180deg,rgba(6,10,19,.22),transparent 20%,transparent 50%,rgba(6,10,19,.85))}
.tcard-info{position:absolute;z-index:6;left:14px;right:56px;bottom:14px;color:#fff;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.tcard-info b{font-size:17px;display:flex;gap:6px;align-items:center}
.tcard-info span{font-size:13px;opacity:.9}
.tcard-info .row{gap:12px;font-size:13px;font-weight:700}

/* categories */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .ci{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.cat .ci svg{width:22px;height:22px}
.cat b{font-size:15px}
.cat small{color:var(--muted);font-size:12.5px;display:block;margin-top:-8px}

/* steps */
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{position:relative;padding:22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.step .n{font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--accent);line-height:1}
.step h3{margin:14px 0 6px}
.sec-night .step{background:var(--night-2);border-color:var(--night-line)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch}
.flow-node{border-radius:var(--r);padding:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.flow-node .fi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.flow-node.mid{background:var(--accent);color:#fff;border-color:transparent}
.flow-node.mid .fi{background:rgba(255,255,255,.18);color:#fff}
.flow-node.mid .muted{color:rgba(255,255,255,.82)}
.flow-arrow{display:grid;place-items:center;color:var(--muted)}
.flow{position:relative}
.flow-node{transition:border-color .3s,box-shadow .3s}
.flow-node.lit{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.flow-node.mid.lit{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.flow-node.paid{border-color:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.flow-coin{position:absolute;left:0;top:0;z-index:3;width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#F7C14B,var(--gold));color:#fff;display:grid;place-items:center;font:800 15px/1 var(--f-display);box-shadow:0 6px 16px rgba(232,155,12,.45),inset 0 -2px 0 rgba(0,0,0,.12);pointer-events:none;opacity:0}

/* feature list */
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sec-night .feat .fi{background:var(--accent-soft);color:var(--accent)}
.feat h4{margin-bottom:4px}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .i{color:var(--good);margin-top:3px}
.checks li.no{color:var(--muted)}
.checks li.no .i{color:var(--muted)}

/* split bar */
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--bg-2)}
.split i{display:block;height:100%}
.split .c{background:var(--good)}
.split .b{background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* campaign card */
.camp{display:flex;flex-direction:column;gap:12px;padding:20px}
.camp .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;background:var(--bg-2);border-radius:var(--r-sm)}
.camp .kv small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.camp .kv b{font-size:14.5px}

/* testimonials, faq */
.quote{padding:24px;display:flex;flex-direction:column;gap:16px}
.quote p{font-size:16px;line-height:1.6}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{font-weight:650;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{transition:transform .2s;color:var(--muted)}
.faq details[open] summary .i{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted);max-width:720px}

/* final cta */
.final{border-radius:28px;background:var(--night);color:var(--on-night);padding:clamp(32px,6vw,72px);position:relative;overflow:hidden;text-align:center}
.final::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 50% 0%,rgba(36,83,255,.12),transparent 70%)}
.final>*{position:relative}

/* footer */
#foot{background:var(--night);color:var(--on-night-2);padding-block:56px 28px;font-size:14px}
#foot .foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:28px}
#foot h4{color:var(--on-night);margin-bottom:12px;font-size:14px}
#foot button{background:none;border:0;padding:4px 0;color:var(--on-night-2);cursor:pointer;display:block;text-align:left;font-size:14px}
#foot button:hover{color:var(--accent)}
#foot .logo{color:var(--ink)}
#foot .foot-bottom{border-top:1px solid var(--night-line);margin-top:36px;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}

/* page header */
.phead{background:var(--bg-2);border-bottom:1px solid var(--line);padding-block:30px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--accent)}

/* explore */
.explore{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:28px 64px}
.filters{display:flex;flex-direction:column;gap:18px;position:sticky;top:88px;align-self:start}
.filters label.fl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;outline:0}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:88px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chipt:hover{border-color:var(--ink)}
.chipt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--good)}
.switch.on::after{left:21px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.filters-toggle{display:none}

/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;padding-block:28px 64px;align-items:start}
.prof-head{display:flex;gap:22px;align-items:flex-start}
.prof-head .av{width:120px;height:120px;border:4px solid var(--surface);box-shadow:var(--shadow)}
.prof-head h1{font-size:clamp(28px,3.4vw,38px)}
.verified-chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px 4px 6px;border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis div{padding:14px 16px;border-right:1px solid var(--line)}
.kpis div:last-child{border-right:0}
.kpis b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.kpis span{font-size:12.5px;color:var(--muted)}
.port{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pkg{position:sticky;top:88px;overflow:hidden}
.pkg-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.pkg-tabs button{background:var(--bg-2);border:0;border-right:1px solid var(--line);padding:14px 6px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.pkg-tabs button:last-child{border-right:0}
.pkg-tabs button.on{background:var(--surface);color:var(--ink);border-bottom-color:var(--accent)}
.pkg-body{padding:22px;display:flex;flex-direction:column;gap:16px}
.pkg-price{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.protect{display:flex;gap:10px;padding:12px 14px;background:var(--good-soft);color:var(--good);border-radius:var(--r-sm);font-size:13px;font-weight:600;align-items:flex-start}
.protect .i{margin-top:2px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13.5px}
.bar-track{height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.review{padding:18px 0;border-bottom:1px solid var(--line);display:flex;gap:14px}
.review:last-child{border-bottom:0}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.biz-av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);color:#fff;flex:none;font-size:15px}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:32px;padding-block:28px 64px;align-items:start}
.stepper{display:flex;gap:6px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
.stepper button{flex:1;min-width:110px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--muted)}
.stepper button::before{content:"";display:block;height:4px;border-radius:999px;background:var(--line);margin-bottom:8px}
.stepper button.done::before,.stepper button.on::before{background:var(--accent)}
.stepper button.on{color:var(--ink)}
.stepper small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stepper span{font-size:13.5px;font-weight:650}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:13.5px;font-weight:650;margin-bottom:6px}
.pkg-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pkg-opt{border:2px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px}
.pkg-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.drop-head{display:flex;gap:12px;align-items:center}
.drop-head .fi{width:38px;height:38px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;color:var(--muted);flex:none}
.filechip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:8px;background:var(--bg-2);font-size:12.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip .i{color:var(--good)}
.paym{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.paym button{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 8px;cursor:pointer;font-weight:750;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.paym button.on{border-color:var(--accent);background:var(--accent-soft)}
.paym .lg{width:38px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.sumrow.total{font-weight:800;font-size:18px;border-top:1px solid var(--line);padding-top:14px}
.demo-note{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--muted);background:var(--bg-2)}

/* tracking timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--good)}
.tl .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:800}
.tl li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.tl li.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl b{display:block;font-size:14.5px}
.tl small{color:var(--muted);font-size:12.5px}
.tl li.todo b{color:var(--muted);font-weight:600}
.hstl{display:flex;gap:0;overflow-x:auto}
.hstl div{flex:1;min-width:92px;text-align:center;font-size:11.5px;font-weight:650;color:var(--muted);position:relative;padding-top:22px}
.hstl div::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.hstl div::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.hstl div:first-child::after{display:none}
.hstl div.done{color:var(--ink)}
.hstl div.done::before,.hstl div.done::after{background:var(--good)}
.hstl div.cur{color:var(--accent)}
.hstl div.cur::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* dashboards */
.dash{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 68px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font-size:14.5px}
.side .who small{color:var(--muted);font-size:12px}
.side button.sl{background:none;border:0;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14.5px}
.side button.sl:hover{background:var(--bg-2)}
.side button.sl.on{background:var(--accent-soft);color:var(--accent)}
.side button.sl .cnt{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.dmain{padding:28px clamp(16px,3vw,36px) 64px;background:var(--bg-2);min-width:0}
.dmain>h1{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.stat{padding:18px;display:flex;flex-direction:column;gap:6px}
.stat small{color:var(--muted);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.stat b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .d{font-size:12.5px;font-weight:650;color:var(--good)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--bg-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.who-cell{display:flex;gap:10px;align-items:center}
.who-cell .av{width:32px;height:32px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.dash-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.dash-2>*,.grid>*,.co>*,.prof>*{min-width:0}
.hfilter{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px;align-items:end}
.dgrid{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px;align-items:start}
.mobile-tabs{display:none}

/* messages */
.msgs{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 180px);min-height:520px;overflow:hidden}
.convs{border-right:1px solid var(--line);overflow:auto}
.conv{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.conv:hover{background:var(--bg-2)}
.conv.on{background:var(--accent-soft)}
.conv .grow b{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.conv .grow span{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.warnbar{display:flex;gap:8px;align-items:center;padding:9px 18px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.thread-body{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:12px;background:var(--bg-2)}
.bub{max-width:min(78%,520px);padding:10px 14px;border-radius:16px;font-size:14.5px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-color:transparent}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.bub.sys{align-self:center;background:var(--accent-soft);color:var(--accent);border:0;font-size:13px;font-weight:600;text-align:center;max-width:90%}
.bub .vt{width:180px;margin-top:6px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center;background:var(--surface)}
.composer input{flex:1;min-width:0}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,10,19,.62);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal-box{background:var(--surface);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-box.wide{max-width:880px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:16px}
@keyframes fade{from{opacity:0}}
.player{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:0}
.player-stage{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden;max-width:100%}
.player-stage .vt{border-radius:0;height:100%;cursor:default}
.player-stage .vt.playing .vt-scene svg{animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:translateX(-50%) scale(1.14) translateY(-3%)}}
.subs{position:absolute;z-index:6;left:16px;right:16px;bottom:58px;text-align:center}
.subs span{background:rgba(0,0,0,.72);color:#fff;font-weight:650;padding:5px 10px;border-radius:6px;font-size:14.5px;line-height:1.7;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pctl{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:12px 14px;display:flex;gap:10px;align-items:center;color:#fff}
.pctl button{background:none;border:0;color:#fff;cursor:pointer;display:grid;place-items:center}
.pctl .trk{flex:1;height:4px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.pctl .trk i{display:block;height:100%;background:#fff;width:0}
.player-side{padding:24px;display:flex;flex-direction:column;gap:16px}
.toasts{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:up .25s}
.toast .i{color:var(--good)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.success-ic{width:68px;height:68px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto}
.success-ic svg{width:34px;height:34px;stroke-width:2.6}

/* verification */
.vsteps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.vstep{text-align:center;font-size:12.5px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.vstep i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-style:normal;font-weight:800;background:var(--surface)}
.vstep.done{color:var(--ink)}
.vstep.done i{background:var(--good);border-color:var(--good);color:#fff}
.vstep.cur{color:var(--accent)}
.vstep.cur i{border-color:var(--accent);color:var(--accent)}

/* signin */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 68px)}
.auth-art{background:var(--night);color:var(--on-night);padding:48px;display:flex;flex-direction:column;justify-content:center;gap:24px;position:relative;overflow:hidden}
.auth-form{padding:48px clamp(16px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:560px}
.demo-acc{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surface);text-align:left;width:100%}
.demo-acc:hover{border-color:var(--accent)}
.demo-acc .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role-pick button{border:2px solid var(--line);border-radius:var(--r);padding:20px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.role-pick button.on{border-color:var(--accent);background:var(--accent-soft)}

/* calculator */
input[type=range]{width:100%;accent-color:var(--accent)}

/* bottom nav (mobile) */
.bnav{display:none}

@media (max-width:1440px){.top-search{display:none}}
@media (max-width:1240px){.nav{display:none}.menu-btn{display:inline-grid}}
@media (max-width:1100px){
  .hfilter{grid-template-columns:1fr 1fr 1fr}
  .nav{display:none}
  .menu-btn{display:inline-grid}
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(3,minmax(0,1fr))}
  .prof,.co{grid-template-columns:minmax(0,1fr) 340px}
  #foot .foot-grid{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr}
  .collage{max-width:520px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps4{grid-template-columns:repeat(2,1fr)}
  .explore{grid-template-columns:1fr}
  .filters{position:static;display:none}
  .filters.open{display:flex;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
  .filters-toggle{display:inline-flex}
  .prof,.co{grid-template-columns:1fr}
  .pkg{position:static}
  .dash{grid-template-columns:1fr}
  .side{display:none}
  .mobile-tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:5}
  .mobile-tabs button{flex:none}
  .dash-2{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow-arrow{transform:rotate(90deg);padding:4px}
  .auth{grid-template-columns:1fr}
  .auth-art{display:none}
  .msgs{grid-template-columns:1fr;height:auto}
  .convs{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}
  .thread-body{min-height:360px}
  .vsteps{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
  .top-search{display:none}
  .player{grid-template-columns:1fr}
  .player-stage{max-height:62vh;aspect-ratio:auto;height:62vh}
}
@media (max-width:760px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);padding:4px;cursor:pointer}
  .bnav button.on{color:var(--accent)}
  .bnav .i{width:22px;height:22px}
  .top-right .btn-ghost,.top-right .gs{display:none}
  .cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:150px;overflow-x:auto;padding-bottom:6px}
  .g2,.form,.pkg-pick{grid-template-columns:1fr}
  .statband .wrap{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpis div:nth-child(2){border-right:0}
  .kpis div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .port{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prof-head{flex-direction:column}
  .paym{grid-template-columns:repeat(2,1fr)}
  #foot .foot-grid{grid-template-columns:1fr 1fr}
  .collage .col:nth-child(3){display:none}
  .collage{grid-template-columns:repeat(2,1fr)}
  .float-card{display:none}
  .camp .kv{grid-template-columns:1fr 1fr}
  .role-pick{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .dgrid>.vt{max-width:240px}
}
@media (max-width:520px){
  .g4,.g3{grid-template-columns:1fr}
  .grid.g4.keep2,.grid.g3.keep2{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .steps4{grid-template-columns:1fr}
  .hero-search .btn span{display:none}
  .hfilter{grid-template-columns:1fr}
  .btn{white-space:normal;text-align:center}
  .stats{grid-template-columns:1fr 1fr}
  .stat b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* real photos (optional, from photos/photos.js) */
.av img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.vt-scene img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;z-index:1;transition:transform 5s ease-out}
.vt:hover .vt-scene img.ph{transform:scale(1.06)}
.player-stage .vt.playing .vt-scene img.ph{animation:kbp 12s ease-in-out infinite alternate}
@keyframes kbp{to{transform:scale(1.12) translateY(-2%)}}

/* demo guide (prototype review aid, see guide.js) */
.guide{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.guide>*{pointer-events:auto}
.guide-btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:9px 9px 9px 14px;font-weight:650;font-size:14px;cursor:pointer;box-shadow:0 12px 32px rgba(14,21,38,.28);transition:transform .15s}
.guide-btn:hover{transform:translateY(-2px)}
.guide-n{background:color-mix(in srgb,var(--bg) 18%,transparent);border-radius:999px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.guide-btn.pulse{animation:gpulse 1.8s 4}
@keyframes gpulse{from{box-shadow:0 0 0 0 rgba(36,83,255,.55),0 12px 32px rgba(14,21,38,.28)}to{box-shadow:0 0 0 16px rgba(36,83,255,0),0 12px 32px rgba(14,21,38,.28)}}
.guide-panel{width:min(380px,calc(100vw - 24px));max-height:min(640px,calc(100dvh - 110px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(10,16,32,.22);overflow:hidden}
.guide-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 18px 12px}
.guide-head b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.guide-head p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.guide-head .iconbtn{width:32px;height:32px}
.guide-prog{display:flex;align-items:center;gap:10px;padding:0 18px 14px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.guide-bar{flex:1;height:6px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.guide-bar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .4s}
.guide-list{overflow:auto;padding:2px 10px 10px;border-top:1px solid var(--line)}
.guide-grp{padding-top:12px}
.guide-grp>small{display:block;padding:0 8px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.guide-step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:9px 8px;cursor:pointer;color:var(--ink)}
.guide-step:hover{background:var(--bg-2)}
.guide-step.here{background:var(--accent-soft)}
.guide-step .grow b{display:block;font-size:14px;font-weight:650}
.guide-step .grow b em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);margin-left:8px}
.guide-step .grow>span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.guide-step>.i{color:var(--muted)}
.guide-dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.guide-step.done .guide-dot{background:var(--good);border-color:var(--good);color:#fff}
.guide-dot .i{width:14px;height:14px;stroke-width:3}
.guide-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.guide-foot p{line-height:1.5}
@media (max-width:760px){.guide{right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}.guide-panel{max-height:calc(100dvh - 210px)}}
@media (max-width:520px){.guide-btn .gl{display:none}.guide-btn{padding:9px 9px 9px 12px}}
/* hero collage tiles are narrow: show only the brand label */
.collage .vt-dur{display:none}
.collage .vt-prop{max-width:calc(100% - 20px)}
</style>
</head>

<header class="top" id="top"></header><main id="view"></main><footer class="foot" id="foot"></footer><nav class="bnav" id="bnav" aria-label="Mobile"></nav><div class="guide" id="guide"></div><div id="modal-root"></div><div class="toasts" id="toasts" aria-live="polite"></div>

function catTile(c){const n=CREATORS.filter(x=>x.cats.some(y=>c.m.includes(y))).length;return `<button class="cat" data-act="cat" data-k="${c.k}"><span class="ci">${ic(c.ic)}</span><b>${c.n}</b><small>${n} creator${n===1?'':'s'}</small></button>`;}
function steps4(){return `<div class="steps4">${[['Discover','Find the creator who fits your brand, audience and budget.'],['Brief','Tell the creator exactly what you need with a structured brief.'],['Create','The creator produces your video. BitPromo checks it against the brief.'],['Approve','Review the video, request a revision or approve to complete the order.']].map(([h,p],i)=>`<div class="step"><span class="n">0${i+1}</span><h3>${h}</h3><p class="muted">${p}</p></div>`).join('')}</div>`;}

/* ===== EXPLORE ===== */
function filtered(){const f=S.f;let r=CREATORS.filter(c=>{
 if(f.q){const hay=(c.name+' '+c.cats.join(' ')+' '+c.tag+' '+c.city+' '+SERVICES.filter(s=>s.c===c.id).map(s=>s.title).join(' ')).toLowerCase();if(!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w.replace(/s$/,''))))return false;}
 if(f.cat){const k=CATS.find(x=>x.k===f.cat);if(k&&!c.cats.some(x=>k.m.includes(x)))return false;}
 if(f.city&&c.city!==f.city)return false;if(f.lang&&!c.langs.includes(f.lang))return false;
 if(f.price){const[lo,hi]=f.price.split('-').map(Number);if(c.price<lo||c.price>hi)return false;}
 if(f.rating&&c.rating<f.rating)return false;if(f.days&&pkgs(c)[0].days>+f.days)return false;
 if(f.aud){const[lo,hi]=f.aud.split('-').map(Number);if(c.followers<lo||c.followers>hi)return false;}
 if(f.avail&&!c.avail)return false;return true;});
 const so={rec:(a,b)=>b.orders*b.rating-a.orders*a.rating,rating:(a,b)=>b.rating-a.rating||b.revs-a.revs,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,orders:(a,b)=>b.orders-a.orders}[f.sort];return r.sort(so);}
PAGES.explore=(cat)=>{if(cat&&CATS.find(x=>x.k===cat)){S.f.cat=cat;}const f=S.f;const sel=(id,key,opts)=>`<select class="field" id="${id}" data-f="${key}">${opts.map(([v,l])=>`<option value="${v}" ${String(f[key])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
 return `<div class="phead"><div class="wrap"><div class="crumbs"><button data-go="home">Home</button>${ic('chevr')}<span>Explore</span></div><div class="row between"><div><h1 style="font-size:clamp(28px,3.4vw,40px)">${f.cat?CATS.find(x=>x.k===f.cat).n:'Explore creators'}</h1><p class="muted" style="margin-top:6px">Verified creators and ready-to-order promotional video services.</p></div>
 <div class="top-search" style="display:flex;min-width:0;width:min(420px,100%);background:var(--surface)"><span class="muted">${ic('search')}</span><input id="ex-q" data-f="q" value="${esc(f.q)}" placeholder="Search creators, actors, influencers…" aria-label="Search" style="width:100%"></div></div></div></div>

  <div><label class="fl" for="f-cat">Category</label>${sel('f-cat','cat',[['','All categories'],...CATS.map(c=>[c.k,c.n])])}</div>
  <div><label class="fl" for="f-city">Location</label>${sel('f-city','city',[['','Anywhere in Bangladesh'],...['Dhaka','Chattogram','Sylhet','Rajshahi','Khulna','Cumilla'].map(x=>[x,x])])}</div>
  <div><label class="fl" for="f-lang">Language</label>${sel('f-lang','lang',[['','Any language'],['Bangla','Bangla'],['English','English'],['Hindi','Hindi']])}</div>
  <div><label class="fl" for="f-price">Starting price</label>${sel('f-price','price',[['','Any price'],['0-5000','Up to ৳5,000'],['5001-10000','৳5,001 – ৳10,000'],['10001-200000','Above ৳10,000']])}</div>
  <div><span class="fl">Rating</span><div class="chips">${[[0,'Any'],[4.7,'4.7+'],[4.8,'4.8+'],[4.9,'4.9+']].map(([v,l])=>`<button class="chipt ${f.rating==v?'on':''}" data-act="fset" data-k="rating" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div><label class="fl" for="f-days">Delivery time</label>${sel('f-days','days',[['','Any time'],['2','Up to 2 days'],['3','Up to 3 days'],['5','Up to 5 days']])}</div>
  <div><label class="fl" for="f-aud">Audience size</label>${sel('f-aud','aud',[['','Any size'],['0-300000','Under 300K'],['300000-1000000','300K – 1M'],['1000000-99000000','1M+']])}</div>
  <div class="row between"><span style="font-weight:650">Available now</span><button class="switch ${f.avail?'on':''}" data-act="fset" data-k="avail" data-v="${!f.avail}" aria-label="Only show available creators" aria-pressed="${f.avail}"></button></div>
  <button class="btn btn-ghost btn-sm" data-act="clearF">Clear all filters</button></aside>
 <div style="min-width:0"><div class="tabs" role="tablist">${[['creators','Creators'],['services','Services']].map(([k,l])=>`<button role="tab" class="${f.tab===k?'on':''}" data-act="exploreTab" data-tab="${k}">${l}</button>`).join('')}<button data-go="campaigns">Campaigns</button></div>
 <div class="row between" style="margin-bottom:18px"><span class="muted" id="count"></span><div class="row"><button class="btn btn-ghost btn-sm filters-toggle" data-act="toggleF">${ic('filter')}Filters</button><label class="small muted" for="f-sort">Sort</label>${sel('f-sort','sort',[['rec','Recommended'],['rating','Highest rated'],['orders','Most orders'],['low','Price: low to high'],['high','Price: high to low']])}</div></div>
 <div id="results"></div></div></div>`;};

ACT.exploreTab=el=>{S.f.tab=el.dataset.tab;if(!ROUTE.startsWith('explore'))go('explore');else render();};

FORM.search=f=>{S.f.q=f.q.value.trim();S.f.cat='';S.f.tab='creators';go('explore');};
FORM.homefilter=f=>{Object.assign(S.f,{q:f.q.value.trim(),cat:f.cat.value,city:f.city.value,lang:f.lang.value,price:f.price.value,tab:'creators'});go('explore');};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.f;if(!k)return;S.f[k]=e.target.value;if(k==='cat'){const h=$('.phead h1');if(h)h.textContent=S.f.cat?CATS.find(x=>x.k===S.f.cat).n:'Explore creators';}renderResults();});

PAGES.creator=(id,p)=>{const c=C(id)||C('c1');if(p!=null&&p!=='')S.pkgSel=+p;const P=pkgs(c);const revs=REVIEWS.filter(r=>r.c===c.id);

 const showRevs=(revs.length?revs:extra).slice(0,4);
 const port=['Restaurant promo','Product review','Eid campaign','Brand intro','Instagram Reel','Testimonial'];
 return `<div class="phead" style="padding-block:20px"><div class="wrap"><div class="crumbs" style="margin:0"><button data-go="home">Home</button>${ic('chevr')}<button data-go="explore">Explore</button>${ic('chevr')}<span>${esc(c.name)}</span></div></div></div>
 <div class="wrap prof"><div class="stack" style="gap:28px;min-width:0">

  <div style="font-weight:600;color:var(--ink-2)">${c.cats.join(' • ')}</div>

  <div class="bars">${[['Age 18–24',34],['Age 25–34',41],['Age 35–44',17],['Age 45+',8]].map(([k,v])=>`<div class="bar-row"><span>${k}</span><div class="bar-track"><i style="width:${v}%;background:var(--good)"></i></div><span class="tnum small muted">${v}%</span></div>`).join('')}</div></div><p class="small muted" style="margin-top:14px">Top cities: Dhaka 52% · Chattogram 18% · Sylhet 9% · Others 21%. Figures shown by the creator and checked at verification.</p></section>
 <section><div class="row between" style="margin-bottom:6px"><h2 style="font-size:22px">Reviews</h2><span class="rating">${ic('star')}${c.rating.toFixed(1)} <span>· ${c.revs} reviews</span></span></div>${showRevs.map(r=>reviewItem(r)).join('')}</section></div>

function reviewItem(r){const b=B(r.b);return `<div class="review">${bizAv(b)}<div class="grow"><div class="row between"><b>${esc(b.name)}</b><span class="small muted">${r.date||''}</span></div><div class="stars">${stars(r.stars)}</div><p style="margin-top:6px;color:var(--ink-2)">${esc(r.text)}</p></div></div>`;}

 <div class="pkg-body"><div class="row between"><b style="font-size:17px">${p.desc}</b></div><div class="pkg-price">${tk(p.price)}</div>

/* ===== motion (GSAP + ScrollTrigger, inlined from vendor/) =====
   Progressive enhancement: every page renders complete without this. Nothing animates when GSAP
   is missing or the viewer prefers reduced motion. render() calls MO.page(); the explore list calls MO.list(). */
const MO=(()=>{const G=window.gsap,ST=window.ScrollTrigger;
 const on=!!(G&&ST)&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(on){G.registerPlugin(ST);G.defaults({ease:'power3.out',duration:.7});}
 const FADE='transform,opacity';
 // blocks that fade up as they scroll into view (only the outermost match animates)
 const REVEAL='.sec-head,.hfilter,.ccard,.tcard,.cat,.step,.feat,.quote,.camp,.faq details,.final,.flow-node,.flow-arrow,.card,.port>.vt,.prof-head,.kpis,.empty,.pkg-opt,.drop,.vstep';
 let last=null,ctx=null,listSig='';
 const outermost=els=>els.filter(el=>!els.some(p=>p!==el&&p.contains(el)));

 // hero headline: words rise out of a mask, then the original markup is restored
 function splitWords(el){const html=el.innerHTML;
  const walk=n=>[...n.childNodes].forEach(c=>{if(c.nodeType===1){walk(c);return;}if(c.nodeType!==3)return;const f=document.createDocumentFragment();
   c.textContent.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){f.append(w);return;}const o=document.createElement('span'),i=document.createElement('span');o.className='w';i.className='wi';i.textContent=w;o.append(i);f.append(o);});c.replaceWith(f);});
  walk(el);return{words:el.querySelectorAll('.wi'),revert:()=>{el.innerHTML=html;}};}

 function heroIntro(hero){const copy=hero.querySelector('.hero-in > div');if(!copy)return;const h1=copy.querySelector('h1'),kids=[...copy.children];
  const before=h1?kids.slice(0,kids.indexOf(h1)):[],after=h1?kids.slice(kids.indexOf(h1)+1):kids;
  const tl=G.timeline();if(before.length)tl.from(before,{y:12,opacity:0,duration:.5,clearProps:FADE});
  if(h1){const sp=splitWords(h1);tl.from(sp.words,{yPercent:115,duration:.95,stagger:.045,ease:'power4.out',onComplete:sp.revert},'-=.25');}
  if(after.length)tl.from(after,{y:18,opacity:0,stagger:.08,duration:.6,clearProps:FADE},'-=.6');
  const tiles=hero.querySelectorAll('.collage .vt');
  if(tiles.length)tl.from(tiles,{y:44,opacity:0,scale:.94,duration:1,stagger:{each:.08,from:'center'},clearProps:FADE},.2);
  const cards=hero.querySelectorAll('.float-card');
  if(cards.length){tl.from(cards,{scale:.6,opacity:0,y:12,duration:.6,ease:'back.out(1.8)',stagger:.25},'-=.35');
   tl.add(()=>G.to(cards,{y:-7,duration:2.4,ease:'sine.inOut',yoyo:true,repeat:-1,stagger:1.2}));}}

 // headers of inner pages, dashboards and sign-in
 function intro(){const ph=document.querySelector('#view .phead .wrap');if(ph)G.from(ph.children,{y:14,opacity:0,duration:.55,stagger:.07,clearProps:FADE});
  const dm=document.querySelector('#view .dmain');if(dm&&dm.firstElementChild)G.from(dm.firstElementChild,{y:12,opacity:0,duration:.5,clearProps:FADE});
  const af=document.querySelector('#view .auth-form');if(af)G.from(af.children,{y:16,opacity:0,stagger:.05,duration:.5,clearProps:FADE});}

 function reveals(){let els=[...document.querySelectorAll('#view '+REVEAL.split(',').join(',#view '))];
  els=outermost(els.filter(el=>!el.closest('.hero,.side,.auth-form')&&el.offsetParent!==null));if(!els.length)return;
  G.set(els,{opacity:0,y:26});
  ST.batch(els,{start:'top 92%',once:true,onEnter:b=>G.to(b,{opacity:1,y:0,duration:.7,stagger:.08,overwrite:true,clearProps:FADE})});}

 // numbers count up from zero, keeping the ৳ sign, grouping and suffix (e.g. "4.9 / 5", "1.2M", "৳64,800")
 function countUp(el){if(el.offsetParent===null)return;const txt=el.textContent,m=txt.match(/^(৳?)(\d[\d,]*(?:\.\d+)?)(.*)$/s);if(!m)return;
  const[,pre,num,post]=m,v=parseFloat(num.replace(/,/g,'')),dec=(num.split('.')[1]||'').length,grp=num.includes(',');if(!v)return;
  const fmt=n=>grp?Math.round(n).toLocaleString('en-IN'):n.toFixed(dec),o={n:0};el.textContent=pre+fmt(0)+post;
  G.to(o,{n:v,duration:1.4,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 95%',once:true},onUpdate:()=>{el.textContent=pre+fmt(o.n)+post;},onComplete:()=>{el.textContent=txt;}});}

 // bars, charts and timelines fill in when they come into view
 function fills(){const st=t=>({trigger:t,start:'top 90%',once:true});
  document.querySelectorAll('#view .split').forEach(el=>G.from(el,{clipPath:'inset(0 100% 0 0 round 999px)',duration:1.2,ease:'power2.inOut',delay:.2,scrollTrigger:st(el)}));
  document.querySelectorAll('#view .bar-track i').forEach(el=>G.from(el,{scaleX:0,transformOrigin:'0 50%',duration:1,ease:'power2.out',delay:.15,scrollTrigger:st(el)}));
  document.querySelectorAll('#view .chart').forEach(svg=>G.from(svg.querySelectorAll('rect'),{scaleY:0,transformOrigin:'50% 100%',duration:.8,stagger:.07,ease:'power2.out',delay:.15,scrollTrigger:st(svg)}));
  document.querySelectorAll('#view .tl').forEach(el=>G.from(el.children,{opacity:0,x:-10,stagger:.06,duration:.45,delay:.2,clearProps:FADE,scrollTrigger:st(el)}));
  document.querySelectorAll('#view .hstl').forEach(el=>G.from(el.children,{opacity:0,y:8,stagger:.05,duration:.4,delay:.25,clearProps:FADE}));}

 // payment protection story: a ৳ coin travels Business → BitPromo (held, checked) → Creator, on loop while visible
 function flowLoop(flow){const nodes=[...flow.querySelectorAll('.flow-node')];if(nodes.length<3)return;const fi=nodes.map(n=>n.querySelector('.fi'));
  const coin=document.createElement('span');coin.className='flow-coin';coin.textContent='৳';coin.setAttribute('aria-hidden','true');flow.append(coin);
  const at=i=>{const f=flow.getBoundingClientRect(),r=fi[i].getBoundingClientRect();return{x:r.right-f.left-14,y:r.top-f.top-12};};
  const mark=(i,cls)=>()=>{nodes.forEach(n=>n.classList.remove('lit','paid'));if(i>=0)nodes[i].classList.add(cls);};
  G.timeline({repeat:-1,repeatDelay:1.4,repeatRefresh:true,delay:.8,scrollTrigger:{trigger:flow,start:'top 80%',end:'bottom top',toggleActions:'play pause resume pause'}})
   .set(coin,{x:()=>at(0).x,y:()=>at(0).y,scale:0,opacity:1}).call(mark(0,'lit'))
   .to(coin,{scale:1,duration:.45,ease:'back.out(2)'})
   .to(coin,{x:()=>at(1).x,y:()=>at(1).y,duration:1.1,ease:'power2.inOut'},'+=.5').call(mark(1,'lit'))
   .to(fi[1],{scale:1.15,duration:.3,yoyo:true,repeat:1,ease:'power2.out'})
   .to(coin,{x:()=>at(2).x,y:()=>at(2).y,duration:1.1,ease:'power2.inOut'},'+=1.1').call(mark(2,'paid'))
   .to(fi[2],{scale:1.15,duration:.3,yoyo:true,repeat:1,ease:'power2.out'})
   .to(coin,{scale:0,duration:.35,ease:'back.in(2)'},'+=.7').call(mark(-1),null,'+=.5');}

 // runs on every render, including re-renders of the same page
 function ambient(){if(innerWidth>900)document.querySelectorAll('#view .hero .collage .col').forEach((c,i)=>G.to(c,{yPercent:[-5,7,-9][i]||0,ease:'none',scrollTrigger:{trigger:c.closest('.hero'),start:'top top',end:'bottom top',scrub:.6}}));
  document.querySelectorAll('#view .flow').forEach(flowLoop);}

 function page(fn){if(!on)return;const changed=ROUTE!==last;last=ROUTE;if(ctx)ctx.revert();
  ctx=G.context(()=>{ambient();
   if(changed){const hero=document.querySelector('#view .hero');if(hero)heroIntro(hero);else intro();reveals();fills();document.querySelectorAll('#view .statband b,#view .stat b,#view .kpis b').forEach(countUp);}
   else if(fn==='order')G.from('#co-step',{opacity:0,y:10,duration:.4,clearProps:FADE});});
  requestAnimationFrame(()=>ST.refresh());}

 // explore results: re-animate only when the set of creators actually changes (not on every keystroke)
 function list(el){const sig=[...el.querySelectorAll('.ccard')].map(c=>c.dataset.go).join();if(sig===listSig)return;listSig=sig;
  if(!on||ROUTE!==last)return;G.from(el.querySelectorAll('.ccard'),{opacity:0,y:14,duration:.45,stagger:.035,clearProps:FADE});}

 if(on){// modals and the mobile drawer ease in; the order-placed check pops
  new MutationObserver(()=>{const box=document.querySelector('#modal-root .modal-box'),dr=document.querySelector('#modal-root .drawer-in');
   if(box){G.from(box,{y:18,scale:.97,opacity:0,duration:.4,clearProps:FADE});const ok=box.querySelector('.success-ic');if(ok)G.from(ok,{scale:0,rotation:-30,duration:.6,ease:'back.out(2.2)',delay:.1});}
   if(dr)G.from(dr,{xPercent:100,duration:.45});}).observe(document.getElementById('modal-root'),{childList:true});
  if(document.fonts)document.fonts.ready.then(()=>ST.refresh());}
 addEventListener('scroll',()=>{const t=document.getElementById('top');if(t)t.classList.toggle('scrolled',scrollY>8);},{passive:true});
 return{page,list};})();

const TSTEPS=TOUR.flatMap(([,items])=>items);

const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const GD={open:false,pulse:false,seen:new Set()};
try{JSON.parse(store.get('bp-tour')||'[]').forEach(r=>GD.seen.add(r));}catch(e){}

function guideHTML(){const n=TSTEPS.filter(s=>GD.seen.has(s[0])).length,total=TSTEPS.length,next=TSTEPS.find(s=>!GD.seen.has(s[0]));let k=0;
 const role=s=>s[3]?`data-role="${s[3]}"`:'';
 return `<div class="guide-panel" id="guide-panel" role="dialog" aria-label="Demo guide" ${GD.open?'':'hidden'}>
 <div class="guide-head"><div><b>Demo guide</b><p>A clickable prototype of BitPromo. Follow the steps to see every part of the product.</p></div><button class="iconbtn" data-act="tour" aria-label="Close demo guide">${ic('x')}</button></div>
 <div class="guide-prog"><div class="guide-bar"><i style="width:${n/total*100}%"></i></div><span>${n} of ${total} viewed</span></div>
 <div class="guide-list">${TOUR.map(([h,items])=>`<div class="guide-grp"><small>${h}</small>${items.map(s=>{k++;const done=GD.seen.has(s[0]),here=ROUTE===s[0];
  return `<button class="guide-step ${done?'done':''} ${here?'here':''}" data-act="tourGo" data-r="${s[0]}" ${role(s)}><span class="guide-dot">${done?ic('check'):k}</span><span class="grow"><b>${s[1]}${here?'<em>You are here</em>':''}</b><span>${s[2]}</span></span>${ic('chevr')}</button>`;}).join('')}</div>`).join('')}</div>
 <div class="guide-foot">${next?`<button class="btn btn-pri btn-block" data-act="tourGo" data-r="${next[0]}" ${role(next)}>Next: ${next[1]} ${ic('arrow')}</button>`:`<div class="protect">${ic('check')}<span>You’ve seen every part of the prototype.</span></div>`}
 <p class="small muted">All people, brands, orders and payments are fictional. Payments are simulated.${n?` <button class="btn-link small" data-act="tourReset">Reset progress</button>`:''}</p></div></div>
 <button class="guide-btn ${GD.pulse?'pulse':''}" data-act="tour" aria-expanded="${GD.open}" aria-controls="guide-panel">${ic('compass')}<span class="gl">Demo guide</span><span class="guide-n">${n}/${total}</span></button>`;}

// called from render(): tick off the page being viewed and redraw
function guideSync(){if(TSTEPS.some(s=>s[0]===ROUTE)&&!GD.seen.has(ROUTE)){GD.seen.add(ROUTE);store.set('bp-tour',JSON.stringify([...GD.seen]));}
 const el=$('#guide');if(el)el.innerHTML=guideHTML();}
function guideOpen(v){GD.open=v;GD.pulse=false;store.set('bp-tour-intro','1');guideSync();
 if(v&&window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches)gsap.from('#guide-panel',{y:16,opacity:0,scale:.97,transformOrigin:'100% 100%',duration:.35,ease:'power3.out'});}
ACT.tour=()=>guideOpen(!GD.open);
ACT.tourGo=el=>{GD.open=false;store.set('bp-tour-intro','1');if(el.dataset.role)S.role=el.dataset.role;go(el.dataset.r);};
ACT.tourReset=()=>{GD.seen.clear();store.set('bp-tour','[]');guideSync();};
// capture phase, so this runs before an action re-renders the guide and detaches the clicked node
document.addEventListener('click',e=>{if(GD.open&&!e.target.closest('#guide'))guideOpen(false);},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&GD.open)guideOpen(false);});
// first visit: open the guide on larger screens, just pulse the button on phones
function guideWelcome(){if(store.get('bp-tour-intro'))return;
 if(innerWidth>760)setTimeout(()=>{if(!GD.open&&!$('#modal-root').children.length)guideOpen(true);},1600);
 else{GD.pulse=true;guideSync();}}
/* ===== boot ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act],[data-go]');if(!el)return;
 if(el.dataset.act){const fn=ACT[el.dataset.act];if(!fn)return;if(el.tagName==='BUTTON'&&el.getAttribute('type')!=='submit')e.preventDefault();fn(el,e);}
 else{e.preventDefault();go(el.dataset.go);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();FORM[f.dataset.form]&&FORM[f.dataset.form](f);});
$('#foot').innerHTML=footer();render();guideWelcome();
</script>
</body>
</html>
